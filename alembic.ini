[alembic]
# Path to migration scripts relative to this file.
script_location = alembic

# Template for generated migration filenames.
file_template = %%(rev)s_%%(slug)s

# Encoding used when writing migration files.
output_encoding = utf-8

# sqlalchemy.url is intentionally left blank here; it is injected
# programmatically from Settings in alembic/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
